<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eunice Reader</title>
  </head>
  <body>
    <div id="app">
      <!-- ── 顶栏 ──
           窗口去掉了系统标题栏，所以这一条同时承担标题栏的职责。
           drag-region="deep" 是 Tauri 的语义：整个子树都能拖（双击即最大化/还原），
           但按钮/链接/输入框这类可点击元素会自动阻断拖拽 —— 不用给每个按钮加例外。
           窗口边缘的缩放热区在 #resize-handles（见文件末尾）。 -->
      <header class="titlebar" data-tauri-drag-region="deep">
        <div class="tb-group tb-left">
          <button class="ic-btn" id="btn-open" data-i18n-tip="tb.open" aria-label="Open"></button>
          <button class="ic-btn" id="btn-save" data-i18n-tip="tb.save" aria-label="Save"></button>
          <div class="ic-split">
            <button class="ic-btn" id="btn-saveas" data-i18n-tip="tb.saveas" aria-label="Save as"></button>
            <button class="ic-btn" id="btn-pdf" data-i18n-tip="tb.pdf" aria-label="Export PDF"></button>
          </div>
        </div>

        <div class="tb-doc">
          <span class="doc-title" id="lbl-filename" data-i18n="tb.noFile">未打开文件</span>
          <span class="doc-dirty" id="lbl-dirty" data-i18n-tip="tb.unsaved" hidden></span>
        </div>

        <div class="tb-group tb-right">
          <div class="seg" role="group" aria-label="view mode">
            <button class="seg-btn" id="btn-view-read" data-i18n-tip="tb.view.read" aria-label="Reading mode"></button>
            <button class="seg-btn" id="btn-view-split" data-i18n-tip="tb.view.split" aria-label="Split mode"></button>
            <button class="seg-btn" id="btn-view-edit" data-i18n-tip="tb.view.edit" aria-label="Edit mode"></button>
          </div>
          <span class="tb-gap"></span>
          <button class="ic-btn" id="btn-zen" data-i18n-tip="tb.zen.on" aria-label="Zen mode"></button>
          <button class="ic-btn" id="btn-toggle-outline" data-i18n-tip="tb.outline" aria-label="Outline"></button>
          <button class="ic-btn" id="btn-theme-quick" data-i18n-tip="tb.theme" aria-label="Toggle theme"></button>
          <button class="ic-btn" id="btn-settings" data-i18n-tip="tb.settings" aria-label="Settings"></button>

          <!-- 自绘窗口控制：与界面同一套图标语言与 hover 反馈 -->
          <div class="win-controls">
            <button class="win-btn" id="btn-win-min" data-i18n-aria="win.minimize"></button>
            <button class="win-btn" id="btn-win-max" data-i18n-aria="win.maximize"></button>
            <button class="win-btn win-close" id="btn-win-close" data-i18n-aria="win.close"></button>
          </div>
        </div>
      </header>

      <!-- ── 主工作区 ── -->
      <div class="workspace" id="workspace">
        <!-- 大纲：全局一个，跟随当前激活的分组 -->
        <aside class="sidebar" id="pane-outline">
          <div class="sidebar-head">
            <span class="sidebar-title" data-i18n="outline.title">大纲</span>
            <button class="ic-btn ic-sm" id="btn-outline-close" data-i18n-tip="outline.collapse" aria-label="Hide outline"></button>
          </div>
          <nav class="outline-list" id="outline-list"></nav>
        </aside>

        <!-- 分组容器：默认 1 个，拖文件到两侧 1/4 时出现第 2 个（分栏） -->
        <div class="groups" id="groups">
          <section class="group is-read is-empty" id="group-g1" data-gid="g1">
            <!-- 顶部 tab 布局：玻璃条压在正文之上，正文从它下面滚过去 -->
            <div class="tabbar">
              <div class="tablist"></div>
              <button class="tab-add" type="button" data-i18n-tip="tab.open" aria-label="Open file"></button>
            </div>

            <div class="group-body">
              <section class="pane-editor">
                <div class="editor-host"></div>
              </section>

              <!-- 分隔条：拖动调整宽度，双击复位；提示靠 cursor 表达，不放中文 title -->
              <div class="splitter" role="separator" aria-orientation="vertical"></div>

              <section class="pane-preview">
                <article class="markdown-body"></article>
                <div class="empty-state">
                  <div class="empty-art"></div>
                  <h2 class="empty-title" data-i18n="empty.title">还没有打开文档</h2>
                  <p class="empty-sub" data-i18n="empty.sub">打开一个 Markdown 文件开始阅读，或直接把文件拖进窗口</p>
                  <div class="empty-keys">
                    <span><kbd>Ctrl</kbd><kbd>O</kbd> <b data-i18n="empty.open">打开</b></span>
                    <span><kbd>Ctrl</kbd><kbd>,</kbd> <b data-i18n="empty.settings">设置</b></span>
                    <span><kbd>Ctrl</kbd><kbd>=</kbd> <b data-i18n="empty.zoom">放大</b></span>
                  </div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </div>

      <!-- ── 状态栏 ── -->
      <footer class="statusbar">
        <span id="stat-lines">—</span>
        <span id="stat-chars"></span>
        <span id="stat-cursor"></span>
        <span class="spacer"></span>
        <!-- 缩放系数：点一下复位 100%，非 100% 时高亮，随时知道自己在哪一档 -->
        <button class="status-zoom" id="stat-zoom" type="button" data-i18n-tip="stat.zoomTip">100%</button>
        <span id="stat-theme"></span>
        <span class="status-enc" id="stat-enc" hidden></span>
      </footer>
    </div>

    <!-- 无边框窗口的缩放热区：8 个方向各一条，hover 到边缘就能拖出尺寸 -->
    <div id="resize-handles" aria-hidden="true">
      <div class="rz rz-n" data-dir="North"></div>
      <div class="rz rz-s" data-dir="South"></div>
      <div class="rz rz-w" data-dir="West"></div>
      <div class="rz rz-e" data-dir="East"></div>
      <div class="rz rz-nw" data-dir="NorthWest"></div>
      <div class="rz rz-ne" data-dir="NorthEast"></div>
      <div class="rz rz-sw" data-dir="SouthWest"></div>
      <div class="rz rz-se" data-dir="SouthEast"></div>
    </div>

    <!-- 设置打开时的轻量遮罩：点它关闭抽屉 -->
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>

    <!-- ── 设置抽屉（右侧，不遮挡文档） ──
         只放高频项：主题、字体、字号、缩放、最近打开。
         低频项（行高/行宽/玻璃/语言/关联/快捷键）在下面的高级模态里。 -->
    <div class="modal-backdrop" id="settings-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" data-i18n-aria="set.title">
        <div class="modal-head">
          <span class="modal-title" data-i18n="set.title">设置</span>
          <span class="modal-sub" data-i18n="set.sub">改完立刻能在文档里看到</span>
          <span class="spacer"></span>
          <button class="ic-btn" id="btn-settings-close" data-i18n-tip="set.close" data-i18n-aria="set.close" aria-label="关闭 · Esc"></button>
        </div>
        <div class="modal-body" id="settings-body"></div>
        <!-- 抽屉底部的唯一出口：低频项全在模态里，不占第一屏 -->
        <div class="modal-foot">
          <button class="adv-entry" id="btn-advanced" type="button">
            <span class="adv-entry-ic" id="adv-entry-ic" aria-hidden="true"></span>
            <span class="adv-entry-text">
              <span class="adv-entry-title" data-i18n="set.advanced">高级设置</span>
              <span class="adv-entry-sub" data-i18n="set.advanced.desc">排版、窗口、文件集成与快捷键</span>
            </span>
            <span class="adv-entry-chev" id="adv-entry-chev" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- ── 高级设置（居中模态） ──
         抽屉里放不下的低频项集中在这里。它是一个真正的模态：居中、有独立遮罩、
         Esc 先关它再关抽屉。 -->
    <div class="adv-backdrop" id="adv-settings" hidden>
      <div class="adv-modal" role="dialog" aria-modal="true" aria-labelledby="adv-title" tabindex="-1">
        <div class="adv-head">
          <span class="adv-title" id="adv-title" data-i18n="set.advanced">高级设置</span>
          <span class="adv-sub" data-i18n="set.advanced.sub">这些项一年也调不了一次，所以不占第一屏。</span>
          <span class="spacer"></span>
          <button class="ic-btn" id="btn-adv-close" data-i18n-tip="set.close" data-i18n-aria="set.close" aria-label="关闭 · Esc"></button>
        </div>
        <div class="adv-body" id="adv-body"></div>
      </div>
    </div>

    <!-- ── 拖放落点提示 ──
         内容由 JS 按当前分栏实况生成（见 main.js 的 buildDropTargets）：每一栏一张卡片，
         卡片位置直接取那一栏的 getBoundingClientRect()，卡片内再切左 / 中 / 右三档。
         所以这里不放静态结构 —— 静态结构一旦与真实分栏对不上，就会出现
         「提示在 A、松手落到 B」。提示层只铺内容区：不含顶栏、大纲侧栏与状态栏。 -->
    <div class="drop-overlay" id="drop-overlay" hidden aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
